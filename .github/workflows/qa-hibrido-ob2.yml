name: QA Híbrido — Registro UI + OB2 API

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente'
        required: true
        type: choice
        options: [Testing, Staging]
        default: Testing
      pais:
        description: 'País'
        required: true
        type: choice
        options: [CO, MX]
        default: CO

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  registro-y-ob2:
    name: "🎭 Playwright → 📮 Newman OB2"
    runs-on: [self-hosted]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias Playwright
        working-directory: playwright
        run: npm install

      - name: Instalar Chromium
        working-directory: playwright
        run: npx playwright install chromium

      - name: Configurar ambiente
        id: config
        run: |
          PAIS_LOWER=$(echo "${{ inputs.pais }}" | tr '[:upper:]' '[:lower:]')
          AMB_LOWER=$(echo "${{ inputs.ambiente }}" | tr '[:upper:]' '[:lower:]')
          ENV_KEY="${AMB_LOWER}-${PAIS_LOWER}"

          if [ "${{ inputs.pais }}" = "MX" ]; then
            DOMAIN="finkargo.com.mx"
            FOLDER="Onboarding Mexico MD"
          else
            DOMAIN="finkargo.com.co"
            FOLDER="Onboarding Colombia MD"
          fi

          BASE_URL="https://app-${AMB_LOWER}.${DOMAIN}"

          echo "env_key=${ENV_KEY}"   >> $GITHUB_OUTPUT
          echo "base_url=${BASE_URL}" >> $GITHUB_OUTPUT
          echo "folder=${FOLDER}"     >> $GITHUB_OUTPUT

      - name: 🎭 Playwright — Registro con OTP
        working-directory: playwright
        env:
          ENV: ${{ steps.config.outputs.env_key }}
        run: npx cucumber-js --tags @registro_completo

      - name: 🔗 Generar environment Newman
        run: |
          node scripts/playwright_to_newman_bridge.js \
            --input  ./playwright/data/registered-users.json \
            --output ./scripts/playwright_env_export.json \
            --base-url ${{ steps.config.outputs.base_url }} \
            --pais ${{ inputs.pais }}

      - name: Check Python
        shell: bash
        run: python3 --version && which python3

      - name: Install Python dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests psycopg2-binary

      - name: Install Newman
        shell: bash
        run: npm install -g newman newman-reporter-htmlextra

      - name: 📮 Newman — OB v2 MX / Flow (Create OB + todos los tests)
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          CONF_USER: ${{ secrets.CONF_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CI: "true"
          PYTHONIOENCODING: "utf-8"
          DB_HOST_TESTING_CO: ${{ secrets.DB_HOST_TESTING_CO }}
          DB_PORT_TESTING_CO: ${{ secrets.DB_PORT_TESTING_CO }}
          DB_NAME_TESTING_CO: ${{ secrets.DB_NAME_TESTING_CO }}
          DB_USER_TESTING_CO: ${{ secrets.DB_USER_TESTING_CO }}
          DB_PASSWORD_TESTING_CO: ${{ secrets.DB_PASSWORD_TESTING_CO }}
          DB_HOST_TESTING_MX: ${{ secrets.DB_HOST_TESTING_MX }}
          DB_PORT_TESTING_MX: ${{ secrets.DB_PORT_TESTING_MX }}
          DB_NAME_TESTING_MX: ${{ secrets.DB_NAME_TESTING_MX }}
          DB_USER_TESTING_MX: ${{ secrets.DB_USER_TESTING_MX }}
          DB_PASSWORD_TESTING_MX: ${{ secrets.DB_PASSWORD_TESTING_MX }}
          DB_HOST_STAGING_CO: ${{ secrets.DB_HOST_STAGING_CO }}
          DB_PORT_STAGING_CO: ${{ secrets.DB_PORT_STAGING_CO }}
          DB_NAME_STAGING_CO: ${{ secrets.DB_NAME_STAGING_CO }}
          DB_USER_STAGING_CO: ${{ secrets.DB_USER_STAGING_CO }}
          DB_PASSWORD_STAGING_CO: ${{ secrets.DB_PASSWORD_STAGING_CO }}
          DB_HOST_STAGING_MX: ${{ secrets.DB_HOST_STAGING_MX }}
          DB_PORT_STAGING_MX: ${{ secrets.DB_PORT_STAGING_MX }}
          DB_NAME_STAGING_MX: ${{ secrets.DB_NAME_STAGING_MX }}
          DB_USER_STAGING_MX: ${{ secrets.DB_USER_STAGING_MX }}
          DB_PASSWORD_STAGING_MX: ${{ secrets.DB_PASSWORD_STAGING_MX }}
        run: |
          chmod +x scripts/run_all.sh
          ./scripts/run_all.sh \
            "OB v2 - MX" \
            "Flow" \
            "${{ inputs.pais }}" \
            "${{ inputs.ambiente }}" \
            "./scripts/playwright_env_export.json"

      - name: Subir reporte Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-ob2-${{ inputs.ambiente }}-${{ inputs.pais }}
          path: |
            scripts/*.html
            scripts/*.json
            scripts/*.txt
          retention-days: 14

      - name: Instalar Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev

      - name: Restaurar historial Allure (para gráfica de tendencias)
        if: always()
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git show-ref --verify refs/remotes/origin/gh-pages 2>/dev/null; then
            mkdir -p playwright/allure-results/history
            git show origin/gh-pages:history 2>/dev/null | tar x -C playwright/allure-results/history || true
          fi

      - name: Generar reporte Allure HTML
        if: always()
        working-directory: playwright
        run: |
          allure generate allure-results --clean -o allure-report
          echo "ambiente=${{ inputs.ambiente }}" >> allure-report/environment.properties
          echo "pais=${{ inputs.pais }}"         >> allure-report/environment.properties
          echo "run=${{ github.run_number }}"    >> allure-report/environment.properties

      - name: Deshabilitar GPG signing (headless runner)
        if: always()
        run: git config --global commit.gpgsign false

      - name: Publicar Allure en GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright/allure-report
          destination_dir: ob2/${{ inputs.ambiente }}/${{ inputs.pais }}
          keep_files: true