name: QA Audit - OB v2 - MX

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner a usar (etiqueta del runner)"
        required: true
        default: "self-hosted"
        type: string
      folder:
        description: "Directorio a auditar"
        required: true
        default: "Flow"
        type: choice
        options:
          - "Flow"
          - "Internal"
          - "Mesa de Control"
          - "KAM"
      pais:
        description: "País contexto de ejecución"
        required: true
        default: "CO"
        type: choice
        options: [CO, MX, ALL]
      ambiente:
        description: "Ambiente de ejecución"
        required: true
        default: "Testing"
        type: choice
        options: [Testing, Staging]

  workflow_call:
    inputs:
      runner:
        type: string
        required: true
        default: "qa-runner"
      folder:
        type: string
        required: true
        default: "Flow"
      pais:
        type: string
        required: true
        default: "CO"
      ambiente:
        type: string
        required: true
        default: "Testing"
    secrets:
      POSTMAN_API_KEY:
        required: true
      CONF_TOKEN:
        required: true
      CONF_USER:
        required: true
      ANTHROPIC_API_KEY:
        required: false
      DB_HOST_TESTING_CO:
        required: false
      DB_PORT_TESTING_CO:
        required: false
      DB_NAME_TESTING_CO:
        required: false
      DB_USER_TESTING_CO:
        required: false
      DB_PASSWORD_TESTING_CO:
        required: false
      DB_HOST_TESTING_MX:
        required: false
      DB_PORT_TESTING_MX:
        required: false
      DB_NAME_TESTING_MX:
        required: false
      DB_USER_TESTING_MX:
        required: false
      DB_PASSWORD_TESTING_MX:
        required: false
      DB_HOST_STAGING_CO:
        required: false
      DB_PORT_STAGING_CO:
        required: false
      DB_NAME_STAGING_CO:
        required: false
      DB_USER_STAGING_CO:
        required: false
      DB_PASSWORD_STAGING_CO:
        required: false
      DB_HOST_STAGING_MX:
        required: false
      DB_PORT_STAGING_MX:
        required: false
      DB_NAME_STAGING_MX:
        required: false
      DB_USER_STAGING_MX:
        required: false
      DB_PASSWORD_STAGING_MX:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  run-audit-pipeline:
    name: "Audit: OB v2 - MX / ${{ inputs.folder }} (${{ inputs.pais }})"
    runs-on: [self-hosted, "${{ inputs.runner }}"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      # ── Python ───────────────────────────────────────────
      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Python (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 --version && which python3

      - name: Install Python dependencies (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests psycopg2-binary

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests psycopg2-binary

      - name: Create python3 alias for Git Bash (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pythonExe = (Get-Command python -ErrorAction SilentlyContinue).Source
          if ($pythonExe) {
            $dir = Split-Path $pythonExe
            Copy-Item $pythonExe "$dir\python3.exe" -Force
            Write-Host "python3.exe creado en: $dir"
          } else {
            Write-Error "Python no encontrado en PATH"
          }

      # ── Node / Newman ────────────────────────────────────
      - name: Check Node (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: node --version && npm --version

      - name: Check Node (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          node --version
          npm --version

      - name: Install Newman (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: npm install -g newman newman-reporter-htmlextra

      - name: Install Newman (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: npm install -g newman newman-reporter-htmlextra

      # ── Ejecución ────────────────────────────────────────
      - name: Execute QA Audit OB v2 MX (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          CONF_USER: ${{ secrets.CONF_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CI: "true"
          PYTHONIOENCODING: "utf-8"
          DB_HOST_TESTING_CO: ${{ secrets.DB_HOST_TESTING_CO }}
          DB_PORT_TESTING_CO: ${{ secrets.DB_PORT_TESTING_CO }}
          DB_NAME_TESTING_CO: ${{ secrets.DB_NAME_TESTING_CO }}
          DB_USER_TESTING_CO: ${{ secrets.DB_USER_TESTING_CO }}
          DB_PASSWORD_TESTING_CO: ${{ secrets.DB_PASSWORD_TESTING_CO }}
          DB_HOST_TESTING_MX: ${{ secrets.DB_HOST_TESTING_MX }}
          DB_PORT_TESTING_MX: ${{ secrets.DB_PORT_TESTING_MX }}
          DB_NAME_TESTING_MX: ${{ secrets.DB_NAME_TESTING_MX }}
          DB_USER_TESTING_MX: ${{ secrets.DB_USER_TESTING_MX }}
          DB_PASSWORD_TESTING_MX: ${{ secrets.DB_PASSWORD_TESTING_MX }}
          DB_HOST_STAGING_CO: ${{ secrets.DB_HOST_STAGING_CO }}
          DB_PORT_STAGING_CO: ${{ secrets.DB_PORT_STAGING_CO }}
          DB_NAME_STAGING_CO: ${{ secrets.DB_NAME_STAGING_CO }}
          DB_USER_STAGING_CO: ${{ secrets.DB_USER_STAGING_CO }}
          DB_PASSWORD_STAGING_CO: ${{ secrets.DB_PASSWORD_STAGING_CO }}
          DB_HOST_STAGING_MX: ${{ secrets.DB_HOST_STAGING_MX }}
          DB_PORT_STAGING_MX: ${{ secrets.DB_PORT_STAGING_MX }}
          DB_NAME_STAGING_MX: ${{ secrets.DB_NAME_STAGING_MX }}
          DB_USER_STAGING_MX: ${{ secrets.DB_USER_STAGING_MX }}
          DB_PASSWORD_STAGING_MX: ${{ secrets.DB_PASSWORD_STAGING_MX }}
        run: |
          chmod +x scripts/run_all.sh
          ./scripts/run_all.sh \
            "OB v2 - MX" \
            "${{ inputs.folder }}" \
            "${{ inputs.pais }}" \
            "${{ inputs.ambiente }}"

      - name: Execute QA Audit OB v2 MX (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          CONF_USER: ${{ secrets.CONF_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CI: "true"
          PYTHONIOENCODING: "utf-8"
          DB_HOST_TESTING_CO: ${{ secrets.DB_HOST_TESTING_CO }}
          DB_PORT_TESTING_CO: ${{ secrets.DB_PORT_TESTING_CO }}
          DB_NAME_TESTING_CO: ${{ secrets.DB_NAME_TESTING_CO }}
          DB_USER_TESTING_CO: ${{ secrets.DB_USER_TESTING_CO }}
          DB_PASSWORD_TESTING_CO: ${{ secrets.DB_PASSWORD_TESTING_CO }}
          DB_HOST_TESTING_MX: ${{ secrets.DB_HOST_TESTING_MX }}
          DB_PORT_TESTING_MX: ${{ secrets.DB_PORT_TESTING_MX }}
          DB_NAME_TESTING_MX: ${{ secrets.DB_NAME_TESTING_MX }}
          DB_USER_TESTING_MX: ${{ secrets.DB_USER_TESTING_MX }}
          DB_PASSWORD_TESTING_MX: ${{ secrets.DB_PASSWORD_TESTING_MX }}
          DB_HOST_STAGING_CO: ${{ secrets.DB_HOST_STAGING_CO }}
          DB_PORT_STAGING_CO: ${{ secrets.DB_PORT_STAGING_CO }}
          DB_NAME_STAGING_CO: ${{ secrets.DB_NAME_STAGING_CO }}
          DB_USER_STAGING_CO: ${{ secrets.DB_USER_STAGING_CO }}
          DB_PASSWORD_STAGING_CO: ${{ secrets.DB_PASSWORD_STAGING_CO }}
          DB_HOST_STAGING_MX: ${{ secrets.DB_HOST_STAGING_MX }}
          DB_PORT_STAGING_MX: ${{ secrets.DB_PORT_STAGING_MX }}
          DB_NAME_STAGING_MX: ${{ secrets.DB_NAME_STAGING_MX }}
          DB_USER_STAGING_MX: ${{ secrets.DB_USER_STAGING_MX }}
          DB_PASSWORD_STAGING_MX: ${{ secrets.DB_PASSWORD_STAGING_MX }}
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          & $bash -c "cd '${{ github.workspace }}' && ./scripts/run_all.sh 'OB v2 - MX' '${{ inputs.folder }}' '${{ inputs.pais }}' '${{ inputs.ambiente }}'"

      # ── Artefactos ───────────────────────────────────────
      - name: Set artifact name (macOS / Linux)
        if: always() && runner.os != 'Windows'
        id: artifact-name-unix
        shell: bash
        run: |
          SAFE=$(echo "${{ inputs.folder }}" | sed 's#[ /]#-#g')
          echo "value=ob-v2-mx-${SAFE}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Set artifact name (Windows)
        if: always() && runner.os == 'Windows'
        id: artifact-name-win
        shell: powershell
        run: |
          $safe = "${{ inputs.folder }}" -replace ' / ', '-' -replace '[^a-zA-Z0-9._\-]', '-'
          echo "value=ob-v2-mx-${safe}-${{ github.run_id }}" >> $env:GITHUB_OUTPUT

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ob-v2-mx-${{ github.run_id }}
          path: |
            scripts/*.html
            scripts/*.json
            scripts/*.txt
            scripts/*.png
          retention-days: 7
