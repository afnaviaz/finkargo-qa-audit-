name: TEST - Simular trigger desde microservicio

# Este workflow simula lo que haría un microservicio real al hacer push.
# Úsalo para validar que workflow_call funciona antes de tocar repos externos.
# Una vez validado, se puede eliminar o dejar como herramienta de debug.

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      modulo:
        description: "Módulo a simular"
        required: true
        default: "onboarding"
        type: choice
        options:
          - user
          - onboarding
          - creditrequest
          - committees
          - financing-co
          - financing-mx

jobs:

  # ── Flujos Críticos ──────────────────────────────────────────

  qa-user:
    name: "Simular msa-marketplace → 1. Create User"
    if: ${{ github.event.inputs.modulo == 'user' }}
    uses: ./.github/workflows/qa-flujos-criticos.yaml
    with:
      folder: "Onboarding Colombia MD / 1. Create User"
      pais: "CO"
      ambiente: "Testing"
    secrets: inherit

  qa-onboarding:
    name: "Simular msa-marketplace → 2. Onboarding"
    if: ${{ github.event.inputs.modulo == 'onboarding' }}
    uses: ./.github/workflows/qa-flujos-criticos.yaml
    with:
      folder: "Onboarding Colombia MD / 2. Onboarding"
      pais: "CO"
      ambiente: "Testing"
    secrets: inherit

  qa-creditrequest:
    name: "Simular msa-marketplace → 3. Create creditrequest"
    if: ${{ github.event.inputs.modulo == 'creditrequest' }}
    uses: ./.github/workflows/qa-flujos-criticos.yaml
    with:
      folder: "Onboarding Colombia MD / 3. Create creditrequest"
      pais: "CO"
      ambiente: "Testing"
    secrets: inherit

  qa-committees:
    name: "Simular msa-marketplace → 4. DecisionCommittee"
    if: ${{ github.event.inputs.modulo == 'committees' }}
    uses: ./.github/workflows/qa-flujos-criticos.yaml
    with:
      folder: "Onboarding Colombia MD / 4. DecisionCommittee"
      pais: "CO"
      ambiente: "Testing"
    secrets: inherit

  # ── Financing Orchestrator ───────────────────────────────────

  qa-financing-co:
    name: "Simular msa-financing-orch → CO / Operations"
    if: ${{ github.event.inputs.modulo == 'financing-co' }}
    uses: ./.github/workflows/qa-financing-orchestrator.yaml
    with:
      folder: "CO / Operations"
      pais: "CO"
      ambiente: "Testing"
    secrets: inherit

  qa-financing-mx:
    name: "Simular msa-financing-orch → MX / Operations"
    if: ${{ github.event.inputs.modulo == 'financing-mx' }}
    uses: ./.github/workflows/qa-financing-orchestrator.yaml
    with:
      folder: "MX / Operations"
      pais: "MX"
      ambiente: "Testing"
    secrets: inherit