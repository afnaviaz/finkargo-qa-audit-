name: QA-Flujos-Criticos

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Carpeta a ejecutar"
        required: true
        default: "PAGA / Onboarding Colombia MD / 1. Create User"
        type: choice
        options:
          - "PAGA / Onboarding Colombia MD / 1. Create User"
          - "PAGA / Onboarding Colombia MD / 2. Onboarding"
          - "PAGA / Onboarding Colombia MD / 3. Create creditrequest"
          - "PAGA / Onboarding Colombia MD / 4. DecisionCommittee"
          - "PAGA / Financing Orchestrator API / Operations"

      pais:
        description: "País"
        required: true
        default: "CO"
        type: choice
        options:
          - CO
          - MX
          - ALL

      ambiente:
        description: "Ambiente de ejecución"
        required: true
        default: "Testing"
        type: choice
        options:
          - Testing
          - Staging

permissions:
  contents: read
  actions: read

jobs:
  run-integrations-pipeline:
    name: "Flujos Críticos: ${{ github.event.inputs.folder }} - ${{ github.event.inputs.pais }}"

    runs-on:
      - self-hosted
      - macOS
      - X64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Validar Python existente en el runner
      - name: Check Python
        shell: bash
        run: |
          python3 --version
          which python3

      - name: Install Python dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests psycopg2-binary

      - name: Check Node
        shell: bash
        run: |
          node --version
          npm --version

      - name: Install Newman
        shell: bash
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Install Playwright
        shell: bash
        run: |
          npm install playwright

      - name: Install Playwright browsers
        shell: bash
        run: |
          npx playwright install chromium

      - name: Execute QA Integrations
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          CONF_USER: ${{ secrets.CONF_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          GITHUB_RUN_NUMBER: ${{ github.run_number }}

          CI: "true"
          PYTHONIOENCODING: "utf-8"

          DB_HOST_TESTING_CO: ${{ secrets.DB_HOST_TESTING_CO }}
          DB_PORT_TESTING_CO: ${{ secrets.DB_PORT_TESTING_CO }}
          DB_NAME_TESTING_CO: ${{ secrets.DB_NAME_TESTING_CO }}
          DB_USER_TESTING_CO: ${{ secrets.DB_USER_TESTING_CO }}
          DB_PASSWORD_TESTING_CO: ${{ secrets.DB_PASSWORD_TESTING_CO }}

          DB_HOST_TESTING_MX: ${{ secrets.DB_HOST_TESTING_MX }}
          DB_PORT_TESTING_MX: ${{ secrets.DB_PORT_TESTING_MX }}
          DB_NAME_TESTING_MX: ${{ secrets.DB_NAME_TESTING_MX }}
          DB_USER_TESTING_MX: ${{ secrets.DB_USER_TESTING_MX }}
          DB_PASSWORD_TESTING_MX: ${{ secrets.DB_PASSWORD_TESTING_MX }}

          DB_HOST_STAGING_CO: ${{ secrets.DB_HOST_STAGING_CO }}
          DB_PORT_STAGING_CO: ${{ secrets.DB_PORT_STAGING_CO }}
          DB_NAME_STAGING_CO: ${{ secrets.DB_NAME_STAGING_CO }}
          DB_USER_STAGING_CO: ${{ secrets.DB_USER_STAGING_CO }}
          DB_PASSWORD_STAGING_CO: ${{ secrets.DB_PASSWORD_STAGING_CO }}

          DB_HOST_STAGING_MX: ${{ secrets.DB_HOST_STAGING_MX }}
          DB_PORT_STAGING_MX: ${{ secrets.DB_PORT_STAGING_MX }}
          DB_NAME_STAGING_MX: ${{ secrets.DB_NAME_STAGING_MX }}
          DB_USER_STAGING_MX: ${{ secrets.DB_USER_STAGING_MX }}
          DB_PASSWORD_STAGING_MX: ${{ secrets.DB_PASSWORD_STAGING_MX }}

        run: |
          chmod +x ./scripts/run_all.sh
          ./scripts/run_all.sh \
            "qa-flujos-criticos" \
            "${{ github.event.inputs.folder }}" \
            "${{ github.event.inputs.pais }}" \
            "${{ github.event.inputs.ambiente }}"

      - name: Set artifact name
        if: always()
        id: artifact-name
        shell: bash
        run: |
          SAFE=$(echo "${{ github.event.inputs.folder }}" | sed 's#[ /]#-#g')
          echo "value=integrations-${SAFE}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: |
            scripts/*.html
            scripts/*.json
            scripts/*.txt
            scripts/*.png
            scripts/playwright-videos/
          retention-days: 7
