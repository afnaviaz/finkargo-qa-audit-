name: Regression QA Audit - ms-core-entities-k8s
on:
  workflow_dispatch:
    inputs:
      proyecto:
        description: "Selecciona el Proyecto a auditar"
        required: true
        default: "ms-core-entities-k8s"
        type: choice
        options: [ms-core-entities-k8s, FLOWS, ms-auth, ms-accounts, ms-payments, ms-kyc, ms-notifications, ms-reports, ms-communicator, INTEGRATIONS]
      pais:
        description: "País a auditar (ALL ejecutará CO y MX)"
        required: true
        default: "CO"
        type: choice
        options: [CO, MX, ALL]
      ambiente:
        description: "Ambiente de ejecución"
        required: true
        default: "Testing"
        type: choice
        options: [Testing, Staging]
      folder:
        description: "Folder específico a ejecutar (opcional, sobreescribe la selección por país)"
        required: false
        default: "01-Register Company"
        type: choice
        options: ["01-Register Company", "02-Legal info CO", "03-Update company", "Suppliers", "Economic Activities", "Contactos de Proveedores", "INTEGRATIONS", "PAGOS", "SUPRA INTEGRATION", "Happy path integration", "SUPRA EPAYMENTS", "Happy path epayments", "Recaudo", "Consultas", "SUPRA WALLET - INTEGRATIONS"]

permissions:
  contents: read
  actions: read

jobs:
  run-audit-pipeline:
    name: "Audit: ${{ github.event.inputs.proyecto }} - ${{ github.event.inputs.pais }}"
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Permissions
        run: chmod +x scripts/run_all.sh
      - name: Execute QA Audit
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run_all.sh \
            "${{ github.event.inputs.proyecto }}" \
            "${{ github.event.inputs.folder }}" \
            "${{ github.event.inputs.pais }}" \
            "${{ github.event.inputs.ambiente }}"
      - name: Upload Local Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.event.inputs.proyecto }}-${{ github.run_id }}
          path: |
            scripts/*.html
            scripts/*.json
            scripts/*.txt
            scripts/*.png
            scripts/playwright-videos/
          retention-days: 7
