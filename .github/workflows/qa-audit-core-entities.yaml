name: core-entities
on:
  workflow_dispatch:
    inputs:
      proyecto:
        description: "Selecciona el Proyecto a auditar"
        required: true
        default: "ms-core-entities-k8s"
        type: choice
        options: [ms-core-entities-k8s]
      pais:
        description: "País a auditar (ALL ejecutará CO y MX)"
        required: true
        default: "CO"
        type: choice
        options: [CO, MX, ALL]
      ambiente:
        description: "Ambiente de ejecución"
        required: true
        default: "Testing"
        type: choice
        options: [Testing, Staging]
      folder:
        description: "Folder específico a ejecutar (opcional, sobreescribe la selección por país)"
        required: false
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  run-audit-pipeline:
    name: "Audit: ${{ github.event.inputs.proyecto }} - ${{ github.event.inputs.pais }}"
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Execute QA Audit
        shell: '/bin/bash {0}'
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/run_all.sh
          ./scripts/run_all.sh \
            "${{ github.event.inputs.proyecto }}" \
            "${{ github.event.inputs.folder }}" \
            "${{ github.event.inputs.pais }}" \
            "${{ github.event.inputs.ambiente }}"

      - name: Upload Local Artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\artifacts" | Out-Null
          Get-ChildItem scripts -Include "*.html","*.json","*.txt" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "${{ github.workspace }}\artifacts\" -ErrorAction SilentlyContinue
          Write-Host "Artifacts guardados:"
          Get-ChildItem "${{ github.workspace }}\artifacts\" -ErrorAction SilentlyContinue |
            Format-Table Name, Length -AutoSize
