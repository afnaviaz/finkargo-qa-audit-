name: QA Audit - core-entities

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner a usar (etiqueta del runner)"
        required: true
        default: "self-hosted"
        type: string
      proyecto:
        description: "Selecciona el Proyecto a auditar"
        required: true
        default: "ms-core-entities-k8s"
        type: choice
        options:
          - ms-core-entities-k8s
      pais:
        description: "País a auditar (ALL ejecutará CO y MX)"
        required: true
        default: "CO"
        type: choice
        options: [CO, MX, ALL]
      ambiente:
        description: "Ambiente de ejecución"
        required: true
        default: "Testing"
        type: choice
        options: [Testing, Staging]
      folder:
        description: "Folder específico a ejecutar (opcional)"
        required: false
        default: ""

  workflow_call:
    inputs:
      runner:
        type: string
        required: true
        default: "qa-runner"
      proyecto:
        type: string
        required: true
        default: "ms-core-entities-k8s"
      pais:
        type: string
        required: true
        default: "CO"
      ambiente:
        type: string
        required: true
        default: "Testing"
      folder:
        type: string
        required: false
        default: ""
    secrets:
      POSTMAN_API_KEY:
        required: true
      CONF_TOKEN:
        required: true
      CONF_USER:
        required: true
      ANTHROPIC_API_KEY:
        required: false
      DB_HOST_TESTING_CO:
        required: false
      DB_PORT_TESTING_CO:
        required: false
      DB_NAME_TESTING_CO:
        required: false
      DB_USER_TESTING_CO:
        required: false
      DB_PASSWORD_TESTING_CO:
        required: false
      DB_HOST_TESTING_MX:
        required: false
      DB_PORT_TESTING_MX:
        required: false
      DB_NAME_TESTING_MX:
        required: false
      DB_USER_TESTING_MX:
        required: false
      DB_PASSWORD_TESTING_MX:
        required: false
      DB_HOST_STAGING_CO:
        required: false
      DB_PORT_STAGING_CO:
        required: false
      DB_NAME_STAGING_CO:
        required: false
      DB_USER_STAGING_CO:
        required: false
      DB_PASSWORD_STAGING_CO:
        required: false
      DB_HOST_STAGING_MX:
        required: false
      DB_PORT_STAGING_MX:
        required: false
      DB_NAME_STAGING_MX:
        required: false
      DB_USER_STAGING_MX:
        required: false
      DB_PASSWORD_STAGING_MX:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  run-audit-pipeline:
    name: "Audit: ${{ inputs.proyecto }} - ${{ inputs.pais }}"
    runs-on: [self-hosted, "${{ inputs.runner }}"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Verificar versión run_all.sh ──────────────────────
      - name: Verify run_all.sh version (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          head -5 scripts/run_all.sh
          grep -n "json.load(sys.stdin)" scripts/run_all.sh || echo "OK - json.load(sys.stdin) no encontrado"

      - name: Verify run_all.sh version (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content scripts/run_all.sh | Select-Object -First 5
          $match = Select-String -Path scripts/run_all.sh -Pattern "json.load\(sys.stdin\)" -Quiet
          if ($match) { Write-Host "WARN: json.load(sys.stdin) encontrado" } else { Write-Host "OK - json.load(sys.stdin) no encontrado" }

      # ── Python ───────────────────────────────────────────
      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Python (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 --version && which python3

      # FIX: Python 3.12+ en Debian/Ubuntu bloquea pip install global.
      # Se usa --break-system-packages para el runner self-hosted
      # donde no hay riesgo de romper el OS del agente.
      - name: Install Python dependencies (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install requests psycopg2-binary --break-system-packages

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests psycopg2-binary

      - name: Create python3 alias for Git Bash (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pythonExe = (Get-Command python -ErrorAction SilentlyContinue).Source
          if ($pythonExe) {
            $dir = Split-Path $pythonExe
            Copy-Item $pythonExe "$dir\python3.exe" -Force
            Write-Host "python3.exe creado en: $dir"
          } else {
            Write-Error "Python no encontrado en PATH"
          }

      # ── Node / Newman ────────────────────────────────────
      - name: Check Node (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: node --version && npm --version

      - name: Check Node (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          node --version
          npm --version

      - name: Install Newman (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: npm install -g newman newman-reporter-htmlextra

      - name: Install Newman (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: npm install -g newman newman-reporter-htmlextra

      # ── Ejecución ────────────────────────────────────────
      - name: Execute QA Core Entities (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          CONF_USER: ${{ secrets.CONF_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CI: "true"
          PYTHONIOENCODING: "utf-8"
          # FIX: fuerza UTF-8 en Windows también para evitar
          # UnicodeDecodeError con emojis en output de Newman
          PYTHONUTF8: "1"
          DB_HOST_TESTING_CO: ${{ secrets.DB_HOST_TESTING_CO }}
          DB_PORT_TESTING_CO: ${{ secrets.DB_PORT_TESTING_CO }}
          DB_NAME_TESTING_CO: ${{ secrets.DB_NAME_TESTING_CO }}
          DB_USER_TESTING_CO: ${{ secrets.DB_USER_TESTING_CO }}
          DB_PASSWORD_TESTING_CO: ${{ secrets.DB_PASSWORD_TESTING_CO }}
          DB_HOST_TESTING_MX: ${{ secrets.DB_HOST_TESTING_MX }}
          DB_PORT_TESTING_MX: ${{ secrets.DB_PORT_TESTING_MX }}
          DB_NAME_TESTING_MX: ${{ secrets.DB_NAME_TESTING_MX }}
          DB_USER_TESTING_MX: ${{ secrets.DB_USER_TESTING_MX }}
          DB_PASSWORD_TESTING_MX: ${{ secrets.DB_PASSWORD_TESTING_MX }}
          DB_HOST_STAGING_CO: ${{ secrets.DB_HOST_STAGING_CO }}
          DB_PORT_STAGING_CO: ${{ secrets.DB_PORT_STAGING_CO }}
          DB_NAME_STAGING_CO: ${{ secrets.DB_NAME_STAGING_CO }}
          DB_USER_STAGING_CO: ${{ secrets.DB_USER_STAGING_CO }}
          DB_PASSWORD_STAGING_CO: ${{ secrets.DB_PASSWORD_STAGING_CO }}
          DB_HOST_STAGING_MX: ${{ secrets.DB_HOST_STAGING_MX }}
          DB_PORT_STAGING_MX: ${{ secrets.DB_PORT_STAGING_MX }}
          DB_NAME_STAGING_MX: ${{ secrets.DB_NAME_STAGING_MX }}
          DB_USER_STAGING_MX: ${{ secrets.DB_USER_STAGING_MX }}
          DB_PASSWORD_STAGING_MX: ${{ secrets.DB_PASSWORD_STAGING_MX }}
        run: |
          chmod +x scripts/run_all.sh
          ./scripts/run_all.sh \
            "${{ inputs.proyecto }}" \
            "${{ inputs.folder }}" \
            "${{ inputs.pais }}" \
            "${{ inputs.ambiente }}"

      - name: Execute QA Core Entities (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          CONF_USER: ${{ secrets.CONF_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CI: "true"
          PYTHONIOENCODING: "utf-8"
          # FIX: fuerza UTF-8 en Windows para evitar UnicodeDecodeError
          # con emojis (🇨🇴, ✅, ⚠️) en el output de Newman → claude_analysis.py
          PYTHONUTF8: "1"
          DB_HOST_TESTING_CO: ${{ secrets.DB_HOST_TESTING_CO }}
          DB_PORT_TESTING_CO: ${{ secrets.DB_PORT_TESTING_CO }}
          DB_NAME_TESTING_CO: ${{ secrets.DB_NAME_TESTING_CO }}
          DB_USER_TESTING_CO: ${{ secrets.DB_USER_TESTING_CO }}
          DB_PASSWORD_TESTING_CO: ${{ secrets.DB_PASSWORD_TESTING_CO }}
          DB_HOST_TESTING_MX: ${{ secrets.DB_HOST_TESTING_MX }}
          DB_PORT_TESTING_MX: ${{ secrets.DB_PORT_TESTING_MX }}
          DB_NAME_TESTING_MX: ${{ secrets.DB_NAME_TESTING_MX }}
          DB_USER_TESTING_MX: ${{ secrets.DB_HOST_TESTING_MX }}
          DB_PASSWORD_TESTING_MX: ${{ secrets.DB_PASSWORD_TESTING_MX }}
          DB_HOST_STAGING_CO: ${{ secrets.DB_HOST_STAGING_CO }}
          DB_PORT_STAGING_CO: ${{ secrets.DB_PORT_STAGING_CO }}
          DB_NAME_STAGING_CO: ${{ secrets.DB_NAME_STAGING_CO }}
          DB_USER_STAGING_CO: ${{ secrets.DB_USER_STAGING_CO }}
          DB_PASSWORD_STAGING_CO: ${{ secrets.DB_PASSWORD_STAGING_CO }}
          DB_HOST_STAGING_MX: ${{ secrets.DB_HOST_STAGING_MX }}
          DB_PORT_STAGING_MX: ${{ secrets.DB_PORT_STAGING_MX }}
          DB_NAME_STAGING_MX: ${{ secrets.DB_NAME_STAGING_MX }}
          DB_USER_STAGING_MX: ${{ secrets.DB_USER_STAGING_MX }}
          DB_PASSWORD_STAGING_MX: ${{ secrets.DB_PASSWORD_STAGING_MX }}
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          & $bash -c "cd '${{ github.workspace }}' && ./scripts/run_all.sh '${{ inputs.proyecto }}' '${{ inputs.folder }}' '${{ inputs.pais }}' '${{ inputs.ambiente }}'"

      # ── Artefactos ───────────────────────────────────────
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-entities-${{ github.run_id }}
          path: |
            scripts/*.html
            scripts/*.json
            scripts/*.txt
            scripts/*.png
          retention-days: 7