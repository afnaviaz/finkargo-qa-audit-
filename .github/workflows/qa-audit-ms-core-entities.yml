name: QA Audit - ms-core-entities

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Selecciona la subcarpeta específica a auditar"
        required: true
        default: "01-Register Company"
        type: choice
        options: 
          - "01-Register Company"
          - "02-Legal info CO"
          - "03-Update company"
          - "Suppliers"
          - "Economic Activities"
          - "Contactos de Proveedores"
      pais:
        description: "País contexto de ejecución (ALL ejecutará CO y MX)"
        required: true
        default: "CO"
        type: choice
        options: [CO, MX, ALL]
      ambiente:
        description: "Ambiente de ejecución (Testing o Staging)"
        required: true
        default: "Testing"
        type: choice
        options: [Testing, Staging]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

permissions:
  contents: read
  actions: read

jobs:
  run-audit-pipeline:
    name: "Audit: ms-core-entities / ${{ github.event.inputs.folder }} (${{ github.event.inputs.pais }})"
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Permissions
        run: chmod +x scripts/run_all.sh

      - name: Execute QA Audit
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Se pasan los argumentos en el orden exacto que requiere tu script:
          # 1. Proyecto estático: ms-core-entities
          # 2. Folder: Subcarpeta seleccionada
          # 3. Pais: Contexto de ejecución
          # 4. Ambiente: Testing/Staging
          ./scripts/run_all.sh \
            "ms-core-entities" \
            "${{ github.event.inputs.folder }}" \
            "${{ github.event.inputs.pais }}" \
            "${{ github.event.inputs.ambiente }}"

      - name: Prepare Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp scripts/*.html scripts/*.json scripts/*.txt artifacts/ 2>/dev/null || true

      - name: Upload Results to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.event.inputs.folder }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 5