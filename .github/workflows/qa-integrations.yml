name: QA Integrations - Flows APP

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Carpeta a ejecutar"
        required: true
        default: "SUPRA / SUPRA INTEGRATION"
        type: choice
        options: [
          "SUPRA / SUPRA INTEGRATION",
          "SUPRA / SUPRA INTEGRATION / Happy path integration",
          "SUPRA / SUPRA INTEGRATION / Rejected flow",
          "SUPRA / SUPRA INTEGRATION / Expired flow",
          "SUPRA / SUPRA WALLET - INTEGRATIONS",
          "SUPRA / SUPRA WALLET - INTEGRATIONS / Happy path integration wallet",
          "SUPRA / SUPRA WALLET - INTEGRATIONS / Happy path integration wallet varios documentos",
          "SUPRA / SUPRA EPAYMENTS",
          "SUPRA / SUPRA EPAYMENTS / Happy path epayments",
          "SUPRA / SUPRA WALLET - EPAYMENTS",
          "SUPRA / SUPRA WALLET - EPAYMENTS / Happy path wallet epayments",
          "COBRE / COBRE INTEGRATIONS",
          "COBRE / COBRE INTEGRATIONS / Happy path cobre",
          "COBRE / COBRE INTEGRATIONS / Happy path cobre fondos insuficientes",
          "STRIPE / Create Payment Card one time",
          "STRIPE / Create Payment Card recurring",
          "STRIPE / Create Payment Oxxo one time",
          "STRIPE / Create Payment Customer balance recurring",
          "STRIPE / Create Payment Customer balance one time",
          "STRIPE EPAYMENTS / Create Payment Card one time epayments",
          "STRIPE EPAYMENTS / Create Payment Card recurring epayments",
          "STRIPE EPAYMENTS / Create Payment Oxxo one time epayments",
          "STRIPE EPAYMENTS / Create Payment Customer balance recurring",
          "STRIPE EPAYMENTS / Create Payment Customer balance one time",
          "ENDPOINTS MIGRADOS / laft-reconsult-monolito",
          "ENDPOINTS MIGRADOS / upload-buro-mx",
          "ENDPOINTS MIGRADOS / common-nit-dates",
          "ENDPOINTS MIGRADOS / sarlaft-last-date",
          "VERTICE / Happy path vertice integrations",
          "VERTICE / Crear Certificado Transporte"
        ]
      pais:
        description: "País"
        required: true
        default: "CO"
        type: choice
        options: [CO, MX, ALL]
      ambiente:
        description: "Ambiente de ejecución"
        required: true
        default: "Testing"
        type: choice
        options: [Testing, Staging]

permissions:
  contents: read
  actions: read

jobs:
  run-integrations-pipeline:
    name: "Integrations: ${{ github.event.inputs.folder }} - ${{ github.event.inputs.pais }}"
    runs-on: [self-hosted]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests psycopg2-binary

      - name: Create python3 alias for Git Bash
        shell: bash
        run: |
          python3 --version || ln -sf $(which python) /usr/local/bin/python3

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Install Playwright
        run: npm install playwright

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Restore Stripe session
        if: contains(github.event.inputs.folder, 'STRIPE')
        shell: bash
        env:
          STRIPE_SESSION: ${{ secrets.STRIPE_SESSION }}
        run: |
          if [ -n "$STRIPE_SESSION" ]; then
            python3 -c "
import sys, base64
data = sys.stdin.read().strip()
data += '=' * (4 - len(data) % 4) % 4
open('${{ github.workspace }}/scripts/playwright/.stripe-session.json', 'wb').write(base64.b64decode(data))
" <<< "$STRIPE_SESSION"
            echo "Stripe session restaurada"
          else
            echo "STRIPE_SESSION no configurado, saltando restauracion"
          fi

      - name: Execute QA Integrations
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.TOKEN_1 }}
          CONF_USER: ${{ secrets.CONF_1 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CI: "true"
          PYTHONIOENCODING: "utf-8"
          STRIPE_EMAIL: ${{ secrets.STRIPE_EMAIL }}
          STRIPE_PASSWORD: ${{ secrets.STRIPE_PASSWORD }}
          STRIPE_ACCOUNT_ID: ${{ secrets.STRIPE_ACCOUNT_ID }}
          DB_HOST_TESTING_CO: ${{ secrets.DB_HOST_TESTING_CO }}
          DB_PORT_TESTING_CO: ${{ secrets.DB_PORT_TESTING_CO }}
          DB_NAME_TESTING_CO: ${{ secrets.DB_NAME_TESTING_CO }}
          DB_USER_TESTING_CO: ${{ secrets.DB_USER_TESTING_CO }}
          DB_PASSWORD_TESTING_CO: ${{ secrets.DB_PASSWORD_TESTING_CO }}
          DB_HOST_TESTING_MX: ${{ secrets.DB_HOST_TESTING_MX }}
          DB_PORT_TESTING_MX: ${{ secrets.DB_PORT_TESTING_MX }}
          DB_NAME_TESTING_MX: ${{ secrets.DB_NAME_TESTING_MX }}
          DB_USER_TESTING_MX: ${{ secrets.DB_USER_TESTING_MX }}
          DB_PASSWORD_TESTING_MX: ${{ secrets.DB_PASSWORD_TESTING_MX }}
          DB_HOST_STAGING_CO: ${{ secrets.DB_HOST_STAGING_CO }}
          DB_PORT_STAGING_CO: ${{ secrets.DB_PORT_STAGING_CO }}
          DB_NAME_STAGING_CO: ${{ secrets.DB_NAME_STAGING_CO }}
          DB_USER_STAGING_CO: ${{ secrets.DB_USER_STAGING_CO }}
          DB_PASSWORD_STAGING_CO: ${{ secrets.DB_PASSWORD_STAGING_CO }}
          DB_HOST_STAGING_MX: ${{ secrets.DB_HOST_STAGING_MX }}
          DB_PORT_STAGING_MX: ${{ secrets.DB_PORT_STAGING_MX }}
          DB_NAME_STAGING_MX: ${{ secrets.DB_NAME_STAGING_MX }}
          DB_USER_STAGING_MX: ${{ secrets.DB_USER_STAGING_MX }}
          DB_PASSWORD_STAGING_MX: ${{ secrets.DB_PASSWORD_STAGING_MX }}
        run: |
          cd "${{ github.workspace }}" && ./scripts/run_all.sh 'INTEGRATIONS' '${{ github.event.inputs.folder }}' '${{ github.event.inputs.pais }}' '${{ github.event.inputs.ambiente }}'

      - name: Set artifact name
        if: always()
        id: artifact-name
        shell: bash
        run: |
          safe=$(echo "${{ github.event.inputs.folder }}" | sed 's/ \/ /-/g' | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "value=integrations-${safe}-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: |
            scripts/*.html
            scripts/*.json
            scripts/*.txt
            scripts/*.png
            scripts/playwright-videos/
          retention-days: 7
