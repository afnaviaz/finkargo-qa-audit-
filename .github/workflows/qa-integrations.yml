name: QA Integrations - Flows APP
on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Carpeta a ejecutar"
        required: true
        default: "Happy path integration"
        type: choice
        options: ["INTEGRATIONS", "PAGOS", "SUPRA INTEGRATION", "Happy path integration", "SUPRA EPAYMENTS", "Happy path epayments", "Recaudo", "Consultas", "SUPRA WALLET - EPAYMENTS"]
      pais:
        description: "País"
        required: true
        default: "CO"
        type: choice
        options: [CO, MX, ALL]
      ambiente:
        description: "Ambiente de ejecución"
        required: true
        default: "Testing"
        type: choice
        options: [Testing, Staging]

permissions:
  contents: read
  actions: read

jobs:
  run-integrations-pipeline:
    name: "Integrations: ${{ github.event.inputs.folder }} - ${{ github.event.inputs.pais }}"
    runs-on: [self-hosted, TROCHACOL]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Execute QA Integrations
        shell: powershell
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          CONF_USER: ${{ secrets.CONF_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CI: "true"
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          & $bash -c "cd '${{ github.workspace }}' && ./scripts/run_all.sh 'INTEGRATIONS' '${{ github.event.inputs.folder }}' '${{ github.event.inputs.pais }}' '${{ github.event.inputs.ambiente }}'"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrations-${{ github.event.inputs.folder }}-${{ github.run_id }}
          path: |
            scripts/*.html
            scripts/*.json
            scripts/*.txt
            scripts/*.png
            scripts/playwright-videos/
          retention-days: 7